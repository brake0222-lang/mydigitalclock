<!DOCTYPE html> 
<html lang="en"> <head>    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
      <title>DIGITAL CLOCK</title>
    <style>      
      body {background-color: #000000;          
            color: white;            
            text-align: center;         
               margin: 0;            
               padding-top: 20px;}
        #day { font-family: "Ink Free", cursive;   
                font-size: 15px;            
                color: #0000FF;}
        #time {font-family: Arial, sans-serif;         
             font-size: 50px;            
             color: #FF0000;}
        #date {font-family: "Ink Free", cursive;            
        font-size: 15px;            
        color: #0000FF;}    
    </style> 
    </head>
<body>
    <div id="day"></div>    
    <div id="time"></div>    
    <div id="date"></div>
    <script>       
     function update() {const now = new Date();
            document.getElementById("time").textContent =now.toLocaleTimeString("en-US", {hour: "2-digit",  
                                                                                          minute: "2-digit",                   
                                                                                          second: "2-digit",                    
                                                                                          hour12: true});
            document.getElementById("day").textContent = now.toLocaleDateString("en-US", {weekday: "long"});
            document.getElementById("date").textContent = now.toLocaleDateString("en-US", {month: "short",                   
                                                                                           day: "2-digit",                   
                                                                                           year: "numeric"});}
        update();        
        setInterval(update, 1000); 
       </script>
</body> 
</html>
